# Every pull request: the dependencies it adds or changes in Gemfile.lock and
# bun.lock, read from GitHub's dependency graph. A known vulnerability, or a
# license outside the list below, fails the check. A new license joins the list
# in the pull request that brings the first dependency under it.
name: Dependency review

on:
  pull_request:

permissions: {}

# A pull request's newer run cancels the older one.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # reads the dependency graph's diff of the pull request
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Ruby is the license of many gems that ship with Ruby (cgi, benchmark).
          allow-licenses: MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, 0BSD, Unlicense, Ruby
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: true
          vulnerability-check: true
          # A comment needs pull-requests: write; the job's summary has the same.
          comment-summary-in-pr: never
