# Development entrypoint: https://github.com/bibendi/dip
# Install with `gem install dip`, then run `dip provision`.

# Minimum dip version
version: "8.0"

compose:
  files:
    - .dockerdev/compose.yml
  # Without it, Compose would name the project after the .dockerdev folder
  project_name: ermida_dev

interaction:
  bash:
    description: Open a Bash shell in the app's container
    service: rails
    command: /bin/bash
    compose:
      run_options: [no-deps]

  bundle:
    description: Run Bundler commands
    service: rails
    command: bundle
    compose:
      run_options: [no-deps]

  rails:
    description: Run Rails commands
    service: rails
    command: bin/rails
    subcommands:
      test:system:
        description: Run system tests against the chrome service, then stop it
        # On the host, so the chrome service compose starts can be stopped afterwards (even on failure or Ctrl-C)
        runner: local
        command: >-
          sh -c 'trap : INT; trap "dip compose stop chrome" EXIT;
          dip compose run --rm rails-chrome bin/rails test:system "$@"' --
      s:
        description: Run the Rails server at http://localhost:3000, with the Vite dev server
        service: web
        compose:
          # `run` instead of `up` keeps the terminal interactive for debugger and binding.irb
          run_options: [service-ports, use-aliases]

  bun:
    description: Run Bun (shipped by bundlebun) for JavaScript packages
    service: rails
    command: bin/bun
    compose:
      run_options: [no-deps]

  rubocop:
    description: Run Standard through RuboCop
    service: rails
    command: bin/rubocop
    compose:
      run_options: [no-deps]

  archspec:
    description: Check layer boundaries (Archspec.rb)
    service: rails
    command: bundle exec archspec
    compose:
      run_options: [no-deps]

  coverage:
    description: Copy the coverage reports from the container to coverage/ (merged one in coverage/merged/index.html)
    service: rails
    command: sh -c 'rm -rf coverage && cp -R "$COVERAGE_DIR" coverage'
    compose:
      run_options: [no-deps]

  ci:
    description: Run bin/ci (config/ci.rb) with the chrome service for system tests, then stop it
    runner: local
    command: >-
      sh -c 'trap : INT; trap "dip compose stop chrome" EXIT;
      dip compose run --rm rails-chrome bin/ci "$@"' --

  psql:
    description: Open a psql console (defaults to the development database)
    service: rails
    command: psql
    default_args: ermida_development

provision:
  # RESET_DOCKER=true dip provision starts from scratch (drops gems and databases)
  - '[ "$RESET_DOCKER" = "true" ] && dip compose down --volumes || true'
  # Compose reads this to run containers and build the image as the host user
  - printf 'DOCKER_UID=%s\nDOCKER_GID=%s\n' "$(id -u)" "$(id -g)" > .dockerdev/.env
  - dip compose build
  - dip compose up -d --wait postgres
  # Installs rails-hyperdrive companion artifacts on `bundle install`. Kept out of the
  # Gemfile so production and CI builds never run it (plugins ignore BUNDLE_WITHOUT
  # and the lockfile). It lands in the bundle volume, next to the gems.
  - dip bundle plugin install bundler-hyperdrive --version 0.2.0
  - dip bash -c "bin/setup --skip-server"
  # Git hooks from prek.toml (pre-commit, commit-msg, pre-push), run on the host. --force writes
  # them to .git/hooks even when a global core.hooksPath is set (prek refuses otherwise); such a
  # global hooks directory must chain to .git/hooks for these to run.
  - mise exec prek@0.5.7 -- prek install --force
